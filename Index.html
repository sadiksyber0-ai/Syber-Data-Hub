<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syber Data Hub - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f9fc;
        }
        .form-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <!-- Top Navigation Icons -->
    <div class="w-full max-w-md relative mb-4">
        <div class="absolute left-0 top-0 space-y-3">
            <!-- WhatsApp Icon -->
            <div class="relative w-12 h-12 bg-[#25D366] rounded-full flex items-center justify-center shadow-lg cursor-pointer">
                <i class="fab fa-whatsapp text-white text-2xl"></i>
                <div class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white font-bold">!</div>
            </div>
            <!-- Chat Icon -->
            <div class="w-12 h-12 bg-[#4c1d95] rounded-full flex items-center justify-center shadow-lg cursor-pointer">
                <i class="fas fa-comment-dots text-white text-xl"></i>
            </div>
        </div>

        <!-- Header Area -->
        <div class="flex flex-col items-center pt-2">
            <div class="flex items-center space-x-2">
                <!-- Custom Logo Placeholder -->
                <div class="w-10 h-10 border-2 border-slate-700 rounded-full flex items-center justify-center relative">
                    <i class="fas fa-chart-bar text-slate-700 text-sm"></i>
                    <i class="fas fa-check absolute bottom-1 right-1 text-[8px] text-orange-500 font-bold"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">
                    Syber Data <span class="text-orange-500">Hub</span>
                </h1>
            </div>
            <p class="text-gray-500 text-sm mt-1">Where Resellers Meet</p>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="absolute right-0 top-2">
            <button class="w-10 h-10 bg-white border border-gray-100 rounded-xl flex items-center justify-center shadow-sm">
                <i class="far fa-moon text-slate-700 text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Green Promo Banner -->
    <div class="w-full max-w-md bg-[#e9fbf4] border border-[#d1f5e8] rounded-2xl p-4 flex items-center justify-between mb-6 cursor-pointer hover:bg-[#dff9ef] transition-colors">
        <div>
            <h3 class="font-bold text-[#065f46] text-sm">Want to buy now?</h3>
            <p class="text-[#059669] text-xs">Skip signup and purchase directly</p>
        </div>
        <i class="fas fa-arrow-right text-[#059669]"></i>
    </div>

    <!-- Create Account Form Card -->
    <div class="w-full max-w-md bg-white rounded-[2rem] p-6 form-shadow mb-8">
        <h2 class="text-2xl font-bold text-slate-800">Create account</h2>
        <p class="text-gray-500 text-sm mb-6">Join thousands of resellers</p>

        <!-- Error Alert -->
        <div class="bg-red-50 border border-red-100 text-red-600 p-3 rounded-xl text-sm mb-4">
            Sign-up cancelled
        </div>

        <!-- Google Auth -->
        <button class="w-full flex items-center justify-center space-x-3 py-3 border border-gray-200 rounded-xl mb-6 hover:bg-gray-50 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
            <span class="text-slate-700 font-medium">Continue with Google</span>
        </button>

        <!-- Divider -->
        <div class="flex items-center space-x-4 mb-6">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-gray-400 text-sm">or</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Registration Form -->
        <form class="space-y-4">
            <!-- Full Name -->
            <div class="relative">
                <i class="far fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Full Name" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
            </div>

            <!-- Email -->
            <div class="relative">
                <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" placeholder="Email" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
            </div>

            <!-- Phone -->
            <div class="relative">
                <i class="fas fa-phone-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" placeholder="Phone (0XX XXX XXXX)" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
            </div>

            <!-- Password -->
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" placeholder="Password (min 6 chars)" class="w-full pl-11 pr-11 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
                <i class="far fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer"></i>
            </div>

            <!-- Confirm Password -->
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" placeholder="Confirm Password" class="w-full pl-11 pr-11 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
                <i class="far fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer"></i>
            </div>

            <!-- Referral -->
            <div class="relative">
                <i class="fas fa-gift absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Referral Code (optional)" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-[#facc15] hover:bg-[#eab308] text-slate-800 font-bold py-4 rounded-xl flex items-center justify-center space-x-2 transition-all transform active:scale-[0.98] mt-4">
                <span>Create Account</span>
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-sm text-gray-500 mt-8">
            Already have an account? <a href="#" class="text-orange-500 font-semibold">Sign In</a>
        </p>
    </div>

    <!-- Copyright Footer -->
    <div class="text-center pb-12">
        <p class="text-gray-400 text-xs">© 2024 Syber Data Hub Ghana</p>
    </div>

    <!-- Bottom Browser Mockup (optional visuals) -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-slate-800/90 backdrop-blur-md rounded-full px-4 py-3 flex items-center justify-between text-white shadow-xl">
        <i class="fas fa-chevron-left text-sm opacity-50"></i>
        <div class="flex items-center space-x-2">
            <div class="w-4 h-4 bg-slate-700 rounded-sm flex items-center justify-center">
                <i class="fas fa-equals text-[8px]"></i>
            </div>
            <span class="text-xs font-medium">syberdatahub.com — Private</span>
        </div>
        <i class="fas fa-redo-alt text-sm opacity-80"></i>
    </div>

</body>
</html>
